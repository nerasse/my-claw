theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css: [assets/docs.css]

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
        - locale: fr
          name: Français
          build: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Install: setup-guide.md
  - Configuration: config.md
  - Models:
      - Identity and resolution: model-identity.md
  - Agents:
      - Sub-agents: subagents.md
  - Remote nodes: remote-nodes.md
  - Sessions:
      - Continue a run: continue.md
  - Operations:
      - Auto-update: auto-update.md
      - CI/CD: ci-cd.md
      - Architecture: architecture.md
  - Security:
      - Approvals: tool-approvals.md

nav_translations:
  fr:
    Home: Accueil
    Install: Installation
    Configuration: Configuration
    Models: Modèles
    "Identity and resolution": Identité et résolution
    Agents: Agents
    "Sub-agents": Sous-agents
    "Remote nodes": Nodes distants
    Sessions: Sessions
    "Continue a run": Continuer un run
    Operations: Exploitation
    "Auto-update": Mises à jour
    CI/CD: CI/CD
    Architecture: Architecture
    Security: Sécurité
    Approvals: Approbations
