# The download relay, as it runs on docker02deb: docs/release-source.md.
#
#   /home/neras/docker/my-claw-dist/
#   ├── compose.yml      this file
#   ├── .env             FORGEJO_TOKEN, RELAY_PROXY_SECRET (0600)
#   ├── relay/           forgejo.ts keys.ts page.ts relay.ts server.ts, copied from the repo
#   └── data/            keys.json, written by the relay (owned by 1000:1000)
services:
  relay:
    image: oven/bun:1.3.13-alpine
    container_name: my-claw-dist
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /relay
    command: ["bun", "server.ts"]
    env_file: .env
    environment:
      FORGEJO_URL: https://git.kssimi.fr
      RELAY_PUBLIC_URL: https://dl.kssimi.fr
      RELAY_ADMINS: neras
      RELAY_DATA: /data
      PORT: "8090"
    volumes:
      - ./relay:/relay:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "10.10.10.51:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 1m
      timeout: 5s
