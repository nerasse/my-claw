name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.13"

jobs:
  release:
    name: Check, test, build, publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl ffmpeg ripgrep

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check

      - name: Check test types
        run: bun run check:test

      - name: Run tests
        run: bun test

      - name: Verify the tag matches package.json
        if: github.event_name == 'push'
        run: |
          version=$(jq -r .version package.json)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json v${version}" >&2
            exit 1
          fi

      - name: Build the server tarball
        run: bash packaging/build-tar.sh

      - name: Build the node client binaries
        run: bash scripts/build-node-client.sh

      - name: Create the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "my-claw ${version}" \
            --notes "Server tarball for ${GITHUB_REF_NAME}, plus the per-platform node client binaries." \
            "dist/my-claw-${version}-linux-x64.tar.gz" \
            dist/node/my-claw-node-"${version}"-*

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

      - name: Keep the build on a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: server-build
          path: |
            dist/my-claw-*-linux-x64.tar.gz
            dist/node/my-claw-node-*
          if-no-files-found: error
