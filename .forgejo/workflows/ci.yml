name: ci

on:
  push:
    branches:
      - main
  pull_request:

env:
  # Pin Bun so CI (and the tested behavior) can't drift when a new Bun ships mid-day.
  BUN_VERSION: "1.3.13"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: debian-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y jq curl

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Check types
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run check

      # The test sources were never type-checked in CI, so stale mocks and dropped
      # constructor arguments piled up unnoticed while `bun test` stayed green.
      - name: Check test types
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run check:test

  test:
    name: Unit & Integration Tests
    runs-on: debian-bookworm
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update
          # ffmpeg from the distro matches the runner's glibc and is stable. The old
          # BtbN rolling "latest" GPL build silently broke CI: a republished binary
          # that would not run on the runner, masked by "ffmpeg -version | head -1"
          # (pipe exit is head's 0), left ffmpeg unusable and only the media tests failed.
          apt-get install -y jq curl ffmpeg
          ffmpeg -version

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Run tests
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test
