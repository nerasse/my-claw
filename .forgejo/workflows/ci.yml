name: ci

on:
  push:
    branches:
      - main
  pull_request:

env:
  # Pin Bun so CI (and the tested behavior) can't drift when a new Bun ships mid-day.
  BUN_VERSION: "1.3.13"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: debian-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y jq curl

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Check types
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run check

  test:
    name: Unit & Integration Tests
    runs-on: debian-bookworm
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y jq curl xz-utils

      - name: Install ffmpeg
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" | tar -xJ --strip-components=2 -C /usr/local/bin/ "ffmpeg-master-latest-linux64-gpl/bin/ffmpeg"
          ffmpeg -version | head -1

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Run tests
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test
