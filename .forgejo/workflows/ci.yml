name: ci

on:
  push:
    branches:
      - main
  pull_request:

env:
  # Pin Bun so CI (and the tested behavior) can't drift when a new Bun ships mid-day.
  BUN_VERSION: "1.3.13"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: debian-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y jq curl

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Check types
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run check

  test:
    name: Unit & Integration Tests
    runs-on: debian-bookworm
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update
          # ffmpeg from the distro matches the runner's glibc and is stable. The old
          # BtbN rolling "latest" GPL build silently broke CI: a republished binary
          # that would not run on the runner, masked by "ffmpeg -version | head -1"
          # (pipe exit is head's 0), left ffmpeg unusable and only the media tests failed.
          apt-get install -y jq curl ffmpeg
          ffmpeg -version

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Run tests
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          set -o pipefail
          bun test 2>&1 | tee /tmp/testlog.txt

      # TEMP DIAGNOSTIC: the runner fails tests that pass locally and in a
      # debian:bookworm container, and Forgejo 14 does not expose job logs via API.
      # Post the failing output + environment as an issue we can read, then remove this.
      - name: Report failure log
        if: failure()
        run: |
          {
            echo "## env"
            uname -a || true
            cat /etc/os-release 2>/dev/null || true
            echo "nproc: $(nproc)"
            echo "ffmpeg: $(command -v ffmpeg) -> $(ffmpeg -version 2>&1 | head -1)"
            df -h / /tmp 2>/dev/null || true
            echo "## test tail"
            tail -c 12000 /tmp/testlog.txt 2>/dev/null || echo "no testlog"
          } > /tmp/report.txt
          BODY=$(jq -Rs . < /tmp/report.txt)
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"CI diag ${{ github.sha }}\",\"body\":${BODY}}" | jq '.number'
