name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: debian-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: https://code.forgejo.org/oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check types
        run: bun run check

  test:
    runs-on: debian-bookworm
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: https://code.forgejo.org/oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test
