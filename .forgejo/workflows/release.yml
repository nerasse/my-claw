name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: debian-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y jq curl xz-utils

      - name: Install ffmpeg
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" | tar -xJ --strip-components=2 -C /usr/local/bin/ "ffmpeg-master-latest-linux64-gpl/bin/ffmpeg"
          ffmpeg -version | head -1

      - name: Install project deps
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install

      - name: Check types
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run check

      - name: Run tests
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test

      - name: Build tarball
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bash packaging/build-tar.sh

      - name: Upload to Package Registry
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          FORGEJO_URL="${FORGEJO_URL:-https://git.kssimi.fr}"
          FORGEJO_USER="${FORGEJO_USER:-neras}"
          VERSION=$(cat package.json | grep '"version"' | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[:space:]')
          TAR_FILE="dist/my-claw-${VERSION}-linux-x64.tar.gz"
          
          curl --fail --user "${FORGEJO_USER}:${FORGEJO_TOKEN}" \
            --upload-file "${TAR_FILE}" \
            "${FORGEJO_URL}/api/packages/claw/generic/my-claw/${VERSION}/my-claw-${VERSION}-linux-x64.tar.gz"
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}

      - name: Cleanup old versions
        run: |
          export FORGEJO_URL="${FORGEJO_URL:-https://git.kssimi.fr}"
          export FORGEJO_USER="${FORGEJO_USER:-neras}"
          bash packaging/cleanup-versions.sh
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          KEEP_VERSIONS: 15
