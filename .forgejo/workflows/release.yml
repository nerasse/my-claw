name: release

on:
  push:
    tags:
      - 'v*'

env:
  # Pin Bun so a release build can't silently use a different runtime than CI.
  BUN_VERSION: "1.3.13"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: debian-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y jq curl ffmpeg
          ffmpeg -version

      - name: Install project deps
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Check types
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run check

  test:
    name: Unit & Integration Tests
    runs-on: debian-bookworm
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: Install system deps
        run: |
          apt-get update
          # ripgrep is the search tool's engine (docs/search.md): the suite exercises the real
          # engine here, and the grep fallback when the tool is ruled out.
          apt-get install -y jq curl ffmpeg ripgrep
          ffmpeg -version

      - name: Install project deps
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Run tests
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test

  build:
    name: Build & Release
    runs-on: debian-bookworm
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y jq curl ffmpeg
          ffmpeg -version

      - name: Install project deps
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          # A tag that disagrees with package.json would publish a mislabeled artifact
          # (tarball name comes from package.json, release name from the tag). Fail loud instead.
          VERSION=$(jq -r '.version' package.json)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}" >&2
            exit 1
          fi
          echo "Tag matches package.json: v${VERSION}"

      - name: Build tarball
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bash packaging/build-tar.sh

      - name: Upload to Package Registry
        run: |
          FORGEJO_URL="${FORGEJO_URL:-https://git.kssimi.fr}"
          FORGEJO_USER="${FORGEJO_USER:-neras}"
          VERSION=$(jq -r '.version' package.json)
          TAR_FILE="dist/my-claw-${VERSION}-linux-x64.tar.gz"
          PKG_URL="${FORGEJO_URL}/api/packages/claw/generic/my-claw/${VERSION}/my-claw-${VERSION}-linux-x64.tar.gz"

          echo "Version: ${VERSION}"
          echo "Tarball: ${TAR_FILE}"
          echo "Package URL: ${PKG_URL}"

          # Idempotent: remove existing file to avoid 409 Conflict on re-tag
          echo "Cleaning any existing package file..."
          curl -fsS -X DELETE --user "${FORGEJO_USER}:${FORGEJO_TOKEN}" "${PKG_URL}" || true

          echo "Uploading..."
          curl --fail --user "${FORGEJO_USER}:${FORGEJO_TOKEN}" \
            --upload-file "${TAR_FILE}" \
            "${PKG_URL}"

          echo "Upload complete."
        env:
          FORGEJO_TOKEN: ${{ secrets.GIT_TOKEN }}

      - name: Create Forgejo Release
        run: |
          FORGEJO_URL="${FORGEJO_URL:-https://git.kssimi.fr}"
          FORGEJO_USER="${FORGEJO_USER:-neras}"
          VERSION=$(jq -r '.version' package.json)
          TAG_NAME="${GITHUB_REF_NAME}"
          PKG_URL="${FORGEJO_URL}/api/packages/claw/generic/my-claw/${VERSION}/my-claw-${VERSION}-linux-x64.tar.gz"

          echo "Creating release for tag ${TAG_NAME}..."

          # Idempotent: delete existing release for this tag to avoid 409
          EXISTING=$(curl -fsS --user "${FORGEJO_USER}:${FORGEJO_TOKEN}" \
            -H "Accept: application/json" \
            "${FORGEJO_URL}/api/v1/repos/claw/my-claw/releases/tags/${TAG_NAME}" 2>/dev/null | jq -r '.id // empty') || true

          if [ -n "${EXISTING}" ] && [ "${EXISTING}" != "null" ]; then
            echo "Release ${EXISTING} already exists for tag ${TAG_NAME}, deleting..."
            curl -fsS -X DELETE --user "${FORGEJO_USER}:${FORGEJO_TOKEN}" \
              "${FORGEJO_URL}/api/v1/repos/claw/my-claw/releases/${EXISTING}" || true
            echo "Deleted existing release."
          fi

          curl --fail --user "${FORGEJO_USER}:${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -X POST \
            -d "$(jq -n \
              --arg tag "${TAG_NAME}" \
              --arg name "my-claw ${VERSION}" \
              --arg body "Universal tar.gz release. Download: ${PKG_URL}" \
              '{tag_name: $tag, name: $name, body: $body, target_commitish: "main"}')" \
            "${FORGEJO_URL}/api/v1/repos/claw/my-claw/releases"

          echo "Release created."
        env:
          FORGEJO_TOKEN: ${{ secrets.GIT_TOKEN }}

      - name: Build node client binaries
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bash scripts/build-node-client.sh

      - name: Upload node client binaries to the release
        run: |
          FORGEJO_URL="${FORGEJO_URL:-https://git.kssimi.fr}"
          FORGEJO_USER="${FORGEJO_USER:-neras}"
          VERSION=$(jq -r '.version' package.json)
          TAG_NAME="${GITHUB_REF_NAME}"
          RELEASE_ID=$(curl -fsS --user "${FORGEJO_USER}:${FORGEJO_TOKEN}" -H "Accept: application/json" \
            "${FORGEJO_URL}/api/v1/repos/claw/my-claw/releases/tags/${TAG_NAME}" | jq -r '.id')
          for file in dist/node/my-claw-node-"${VERSION}"-*; do
            name=$(basename "$file")
            echo "Uploading ${name}..."
            curl --fail --user "${FORGEJO_USER}:${FORGEJO_TOKEN}" \
              -F "attachment=@${file}" \
              "${FORGEJO_URL}/api/v1/repos/claw/my-claw/releases/${RELEASE_ID}/assets?name=${name}"
          done
        env:
          FORGEJO_TOKEN: ${{ secrets.GIT_TOKEN }}

      - name: Cleanup old versions
        run: |
          export FORGEJO_URL="${FORGEJO_URL:-https://git.kssimi.fr}"
          export FORGEJO_USER="${FORGEJO_USER:-neras}"
          bash packaging/cleanup-versions.sh
        env:
          FORGEJO_TOKEN: ${{ secrets.GIT_TOKEN }}
          KEEP_VERSIONS: 15
